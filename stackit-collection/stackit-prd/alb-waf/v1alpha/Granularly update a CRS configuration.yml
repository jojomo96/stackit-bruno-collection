  type: http
  seq: 5

http:
  method: PATCH
  url: "{{baseUrl}}/v1alpha/projects/:projectId/regions/:region/core-rule-sets/:name"
  params:
    - name: projectId
      value: ""
      type: path
    - name: region
      value: ""
      type: path
    - name: name
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
        "active": true,
        "groups": {
          "942": {
            "rules": {
              "942100": {
                "mode": "MODE_DISABLED"
              }
            }
          }
        },
        "name": "my-core-rule-set-config",
        "projectId": "2438ac3c-37eb-4902-adef-ed16b4431030",
        "region": "eu01"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

