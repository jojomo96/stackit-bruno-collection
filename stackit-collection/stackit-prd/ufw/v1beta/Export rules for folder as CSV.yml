info:
  name: Export rules for folder as CSV
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/v1beta/folder/:folderId/regions/:regionId/rules/export"
  params:
    - name: folderId
      value: ""
      type: path
      description: The STACKIT portal folder UUID the key ring is part of.
    - name: regionId
      value: eu01
      type: path
      description: The STACKIT region name the resource is located in.
    - name: regionId
      value: eu02
      type: path
      description: The STACKIT region name the resource is located in.
      disabled: true
    - name: direction
      value: ""
      type: query
      disabled: true
    - name: etherType
      value: ""
      type: query
      disabled: true
    - name: instanceName
      value: ""
      type: query
      disabled: true
    - name: portRange
      value: ""
      type: query
      disabled: true
    - name: product
      value: ""
      type: query
      disabled: true
    - name: protocol
      value: ""
      type: query
      disabled: true
    - name: sourceIP
      value: ""
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

