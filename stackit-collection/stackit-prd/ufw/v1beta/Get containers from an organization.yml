info:
  name: Get containers from an organization
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/v1beta/organizations/:organizationId/children"
  params:
    - name: organizationId
      value: ""
      type: path
      description: The STACKIT portal organization UUID the key ring is part of.
    - name: limit
      value: ""
      type: query
      description: The maximum number of items to return in the response. If maximum is exceeded, maximum is used.
      disabled: true
    - name: cursor
      value: ""
      type: query
      description: A pagination cursor that represents a position in the dataset. If given, results will be returned from the item after the cursor. If not given, results will be returned from the beginning.
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

