info:
  name: get latest restore information for provided instanceId
  type: http
  seq: 18

http:
  method: GET
  url: "{{baseUrl}}/v2/projects/:projectId/regions/:regionId/instances/:instanceId/restores"
  params:
    - name: projectId
      value: ""
      type: path
      description: Project id on which user has permissions
    - name: regionId
      value: ""
      type: path
      description: region in which the project resides
    - name: instanceId
      value: ""
      type: path
      description: Instance id
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

