info:
  name: Get Instance User information.
  type: http
  seq: 18

http:
  method: GET
  url: "{{baseUrl}}/v1beta/projects/:projectId/instances/:instanceId/users/:username"
  params:
    - name: projectId
      value: 83b8e9c4-e3d1-4dc4-bb89-9854c8b5383e
      type: path
      description: Project identifier.
    - name: instanceId
      value: 83b8e9c4-e3d1-4dc4-bb89-9854c8b5383e
      type: path
      description: Instance identifier.
    - name: username
      value: myusername
      type: path
      description: Instance User identifier.
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

