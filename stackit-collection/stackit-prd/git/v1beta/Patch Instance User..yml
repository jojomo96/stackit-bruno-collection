http:
  method: PATCH
  url: "{{baseUrl}}/v1beta/projects/:projectId/instances/:instanceId/users/:username"
  params:
    - name: projectId
      value: 83b8e9c4-e3d1-4dc4-bb89-9854c8b5383e
      type: path
      description: Project identifier.
    - name: instanceId
      value: 83b8e9c4-e3d1-4dc4-bb89-9854c8b5383e
      type: path
      description: Instance identifier.
    - name: username
      value: myusername
      type: path
      description: Instance User identifier.
  body:
    type: json
    data: |-
      {
        "email": "my-new-email",
        "name": "my-new-user-name",
        "password": "my-new-password"
      }
  auth: inherit

settings:
