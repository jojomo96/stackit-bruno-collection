info:
  name: UpdateDagBundle
  type: http
  seq: 10

http:
  method: PATCH
  url: "{{baseUrl}}/v1alpha/projects/:projectId/regions/:regionId/instances/:instanceId/dag-bundles/:bundleName"
  params:
    - name: projectId
      value: ""
      type: path
      description: The STACKIT portal project UUID the STACKIT Workflows instance is part of.
    - name: regionId
      value: ""
      type: path
      description: The STACKIT region the STACKIT Workflows instance is part of.
    - name: instanceId
      value: ""
      type: path
      description: The STACKIT Workflows instance UUID.
    - name: bundleName
      value: ""
      type: path
      description: |
        The unique name of the DAG bundle. Must be a valid DNS label (lowercase alphanumeric and hyphens, max 63 characters).
  body:
    type: json
    data: "{}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

