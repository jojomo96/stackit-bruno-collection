info:
  name: ListInstances
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/v1alpha/projects/:projectId/regions/:regionId/instances"
  params:
    - name: projectId
      value: ""
      type: path
      description: The STACKIT portal project UUID the STACKIT Workflows instance is part of.
    - name: regionId
      value: ""
      type: path
      description: The STACKIT region the STACKIT Workflows instance is part of.
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

