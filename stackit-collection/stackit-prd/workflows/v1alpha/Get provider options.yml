info:
  name: Get provider options
  type: http
  seq: 14

http:
  method: GET
  url: "{{baseUrl}}/v1alpha/regions/:regionId/provider-options"
  params:
    - name: regionId
      value: ""
      type: path
      description: The STACKIT region the STACKIT Workflows instance is part of.
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

